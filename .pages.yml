# Pages CMS config (https://pagescms.org). Open https://app.pagescms.org, sign in with GitHub, pick this repo.
media:
  input: assets/images
  output: /assets/images
  categories: [image]
content:
  - name: site
    label: Site settings
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: product_name
        label: Product name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Short description (search engines and link previews)
        type: text
      - name: support_email
        label: Support / contact email
        type: string
        description: Shown on every page and in the policies.
      - name: price_monthly
        label: Pro monthly price
        type: string
        description: A number such as 4.99. Write TBD (or leave empty) to show "Coming soon".
      - name: price_yearly
        label: Pro yearly price
        type: string
        description: A number such as 39. Write TBD (or leave empty) to show "Coming soon".
      - name: price_currency
        label: Currency
        type: string
      - name: pro_status
        label: Pro launch status text
        type: string
      - name: refund_days
        label: Yearly refund window (days)
        type: number
      - name: command_center_shortcut
        label: Command Center shortcut
        type: string
      - name: chrome_store_url
        label: Chrome Web Store URL
        type: string
        description: Leave empty to show "Coming soon".
      - name: edge_store_url
        label: Microsoft Edge Add-ons URL
        type: string
        description: Leave empty to show "Coming soon".
      - name: policies_updated
        label: Policies last updated
        type: date
      - name: free_features
        label: Free plan features
        type: string
        list: true
      - name: pro_features
        label: Pro plan features
        type: string
        list: true
  - name: pages
    label: Pages
    type: collection
    path: pages
    format: yaml-frontmatter
    view:
      primary: title
    operations:
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: permalink
        label: Web address
        type: string
        readonly: true
      - name: body
        label: Page text (Markdown)
        type: code
        options:
          format: markdown
