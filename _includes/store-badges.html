{%- include i18n.html -%}
<div class="stores">
  {% if s.chrome_store_url and s.chrome_store_url != "" %}<a class="store" href="{{ s.chrome_store_url }}" rel="noopener">{% include chrome.svg %}<span><small>{{ tr.stores.available_in }}</small>Chrome Web Store</span></a>{% else %}<span class="store soon" aria-label="{{ tr.stores.chrome_soon_aria }}">{% include chrome.svg %}<span><small>Chrome Web Store</small>{{ tr.stores.soon }}</span></span>{% endif %}
</div>{% if include.hero %}{% include hero-extra.html %}{% endif %}
