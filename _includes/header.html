{%- assign s = site.data.site -%}
<a class="skip" href="#main">Skip to content</a>
<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/images/logo.svg' | relative_url }}" width="32" height="32" alt=""><span>{{ s.product_name }}</span></a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>Product</a>
      <a href="{{ '/pricing.html' | relative_url }}"{% if page.url == '/pricing.html' %} aria-current="page"{% endif %}>Pricing</a>
      <a href="{{ '/privacy.html' | relative_url }}"{% if page.url == '/privacy.html' %} aria-current="page"{% endif %}>Privacy</a>
      <a href="{{ '/terms.html' | relative_url }}"{% if page.url == '/terms.html' %} aria-current="page"{% endif %}>Terms</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" onclick="var d=document.documentElement,on=d.getAttribute('data-theme')!=='dark';if(on)d.setAttribute('data-theme','dark');else d.removeAttribute('data-theme');try{localStorage.setItem('theme',on?'dark':'light')}catch(e){}this.setAttribute('aria-label',on?'Switch to light mode':'Switch to dark mode')"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </nav>
  </div>
</header>
