---
layout: default
body_class: policy-page
---
{%- assign s = site.data.site -%}
<article class="wrap narrow doc">
  <header class="doc-head">
    <p class="eyebrow">{{ s.product_name }}</p>
    <h1>{{ page.title }}</h1>
    <p class="muted">Last updated: {{ s.policies_updated | date: "%-d %B %Y" }}</p>
  </header>
  <div class="prose">
{{ content }}
  </div>
</article>
