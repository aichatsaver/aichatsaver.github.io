  yearly_save: "Spare %pct%"
  howpro_h2: So funktioniert Pro
  howpro_p: Kein Konto, kein Passwort. Dein Lizenzschlüssel ist deine Anmeldung.
  howpro_steps:
  - t: Tarif wählen
    d: Klicke hier auf „Pro holen“ oder in der Erweiterung auf „Upgrade“. Ein sicherer Bezahlvorgang von Freemius öffnet sich. Bezahle per Karte oder PayPal.
  - t: Lizenzschlüssel erhalten
    d: Er erscheint sofort auf der Dankesseite und wird an die E-Mail-Adresse geschickt, die du beim Bezahlen angegeben hast.
  - t: In der Erweiterung aktivieren
    d: Öffne Pro, füge deinen Schlüssel ein und klicke auf „Aktivieren“. Du siehst dann „Angemeldet als“ mit deiner E-Mail-Adresse, deinem Tarif und dem Verlängerungsdatum.
  - t: Jederzeit verwalten
    d: Unter „Konto verwalten“ siehst du Rechnungen, kannst kündigen oder deinen Schlüssel wiederfinden. Melde dich auf einem Gerät ab, um Pro auf einem anderen zu nutzen.
  fine: Zahlungen und Lizenzschlüssel für Pro wickelt unser Wiederverkäufer und Händler (Merchant of Record), Freemius, Inc., ab. Je nach Wohnort können beim Bezahlen Steuern hinzukommen. Siehe die <a href="%terms_url%">Nutzungsbedingungen</a> (auf Englisch). Gesetzliche Verbraucherrechte bleiben, soweit anwendbar, unberührt.
maint:
  title: Wir sind gleich zurück
  message: Die Website wird gerade kurz aktualisiert. Bitte schau in Kürze wieder vorbei.
