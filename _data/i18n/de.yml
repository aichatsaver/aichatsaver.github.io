  - "Command Center zum Ansehen deiner Chats"
  - "Offenen Chat manuell speichern"
  - "8 neue Chats pro Tag"
  - "8 Exporte pro Tag, jedes Format"
  - "Studio und Markierungen"
  - "Medien aller KIs (außer Grok)"
  - "Speichert in Downloads"
  - "Kleines Logo als Wasserzeichen"
  pro_features:
