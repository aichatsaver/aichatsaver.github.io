meta:
  tagline: Speichere jeden KI-Chat in einem Ordner auf deinem eigenen Computer.
  description: "AI Chat Saver ist eine Browser-Erweiterung, die deine Chats aus 18 KI-Assistenten in einem lokalen Ordner speichert, mit Suche und Exporten in jedem Format. Pro ergänzt die Synchronisierung aller KIs per Klick und Exporte, die wie die Original-Websites aussehen."
  pro_status: Pro – bald verfügbar
  free_features:
