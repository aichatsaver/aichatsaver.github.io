  howpro_p: アカウント作成もパスワードも不要。ライセンスキーがそのままログインになります。
  howpro_steps:
  - t: プランを選ぶ
    d: このページの「Pro を入手」、または拡張機能内の「アップグレード」を押します。Freemius による安全な決済画面が開きます。カードまたは PayPal でお支払いください。
  - t: ライセンスキーを受け取る
    d: お礼画面にすぐ表示され、決済時に入力したメールアドレスにも送信されます。
  - t: 拡張機能で有効化する
    d: Pro を開いてキーを貼り付け、「有効化」を押します。「ログイン中のアカウント」としてメールアドレス、プラン、更新日が表示されます。
  - t: いつでも管理
    d: 「アカウントを管理」から請求書の確認、解約、キーの再確認ができます。別のデバイスで Pro を使うには、今のデバイスでログアウトしてください。
  fine: Pro の決済とライセンスキーは、当社の再販業者・販売責任者（Merchant of Record）である Freemius, Inc. が取り扱います。お住まいの地域によっては、決済時に税金が加算される場合があります。<a href="%terms_url%">利用規約</a>（英語）をご覧ください。適用される場合、消費者の法的権利は影響を受けません。
