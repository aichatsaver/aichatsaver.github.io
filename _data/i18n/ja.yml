home:
  title: 製品
  logo_alt: '%name% のロゴ'
  h1_a: すべての AI チャットを、
  h1_b: あなたのパソコンに保存
  h1_c: 。
  lede: '%name% は、18 の AI アシスタントとのチャットを、あなた自身のパソコン上のフォルダに保存するブラウザ拡張機能です。ワンクリックで常に最新に保たれ、データがデバイスの外に出ることはありません。'
  hero_note: Google Chrome と Microsoft Edge に対応。
  ais_h2: 18 の AI に対応
  ais_p: いつもどおりブラウザで各 AI にログインするだけ。%name% がそれぞれのチャットを専用のフォルダに保存します。
  features_h2: テキストだけでなく、チャットのすべてを
  features_p: チャットが、あなたのものになる本物のファイルに。オフラインで読めて、検索でき、すぐにエクスポートできます。
  f1_h: 自分だけのローカルフォルダ
  f1_p: チャットは <strong>Downloads/AI Chat Saver</strong> に AI ごとのフォルダで、Markdown・HTML・JSON として書き出され、メディアも一緒に保存されます。フォルダを一度接続すれば、「名前を付けて保存」ダイアログなしで直接そこに保存されます。
  f2_h: ワンクリックの差分更新
  f2_p: 更新ボタンひとつですべての AI を同期し、新しいチャットや変更されたチャットだけを保存するので、同じものを二度ダウンロードすることはありません。ポップアップから実行するか、<kbd>Alt+Shift+U</kbd> を押すか、1 時間ごと・6 時間ごと・毎日・毎週のスケジュールを設定できます。
  f3_h: メディア、思考過程、コード、アーティファクトも保存
  f3_items:
  - アップロードした画像・動画・ファイルと、生成されたもの
  - 思考・推論の過程、ツール呼び出し、AI が実行したコードとその出力
  - Web の出典と引用
  - Claude のアーティファクトと ChatGPT のキャンバスを実ファイルとして保存
  - サイト上で削除されたメッセージも「サイトで削除済み」として残り、編集したプロンプトはバージョンとして保存
  f4_h: 元のサイトそのままのエクスポート
  f4_p: <strong>HTML、Markdown、PDF、Word (DOCX)、TXT</strong> のほか、JSON、PNG、JPG にもエクスポートできます。各 AI サイト本来の見た目をライト・ダークどちらでも保てます。PDF はパソコン上で作成され、選択できる本物のテキストを含み、印刷ダイアログも不要です。
  f5_h: 検索とコマンドセンター
  f5_p: <kbd>%shortcut%</kbd> を押すと全画面のコマンドセンターが開きます。すべての AI を横断する即時全文検索、<code>provider:</code> や <code>has:code</code> などのフィルター、コマンドパレット（<kbd>Ctrl+K</kbd>）、タイムライン、ハイライトとメモ、そして閲覧モードを備えています。
  f6_h: 設計段階からプライバシーを重視
  f6_p: すべてはブラウザ内で、あなた自身のログインセッションを使って動作します。チャットはデバイスに残ります。当社のアカウントも、サーバーも、アクセス解析もありません。
  how_h2: 使い方
  steps:
  - t: 拡張機能をインストール
    d: Chrome または Edge に追加して、アイコンをピン留めします。
  - t: AI にログインしたままにする
    d: いつもどおり、同じブラウザプロファイルで各 AI サイトを使います。
  - t: 「更新」を押す
    d: チャットがフォルダに保存されます。いつでも何度でも押せます。保存されるのは新しいチャットと変更されたチャットだけです。
  priv_eyebrow: プライバシー
  priv_h2: あなたのチャットが当社に届くことはありません
  priv_p: '%name% は、ログイン中の AI サイトからブラウザ経由でチャットを読み込み、あなた自身のフォルダとブラウザのローカルストレージにのみ書き込みます。<a href="%privacy_url%">プライバシーポリシー</a>の全文（英語）をご覧ください。'
  priv_items:
  - チャットの内容が開発者に送信されることはありません
  - アクセス解析やトラッキングは一切なし
  - データを販売することは決してありません
  - アンインストールするかフォルダを削除すれば、すべて消去されます
  faq_h2: よくある質問
  faq:
  - q: アカウントは必要ですか？
    a: いいえ。%name% は、各 AI サイトで既にお使いのセッションを利用します。Pro では、決済パートナーである Freemius のライセンスキーを使います。拡張機能に一度貼り付ければ、ログイン完了です。
  - q: チャットはどこに保存されますか？
    a: "パソコン上の Downloads/AI Chat Saver（AI ごとにフォルダ）に保存されます。Pro なら、パソコン上の好きなフォルダを選べます。検索をすぐに行えるよう、ブラウザのローカルストレージにもコピーが保存されます。"
  - q: AI サイトの仕様が変わったらどうなりますか？
    a: 拡張機能は同期のたびにすべての AI をチェックします。サイトの変更で保存できなくなった場合は、通知とバナーで一度だけお知らせします。失敗した実行が、正しく保存済みのチャットを上書きすることはありません。
  - q: 無料ですか？
    a: はい、Free プランがあります。%pro_status%。<a href="%pricing_url%">料金</a>をご覧ください。
  - q: ライセンスキーをなくした、またはメールアドレスを間違えた
    a: お支払いの領収書を添えて <a href="mailto:%email%">%email%</a> までメールしてください。ライセンスのメールアドレスを修正し、キーを再送します。
  cta_h2: すべての会話を残そう
