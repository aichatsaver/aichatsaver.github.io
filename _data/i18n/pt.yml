  tagline: Salve cada chat de IA em uma pasta no seu próprio computador.
  description: "AI Chat Saver é uma extensão de navegador que salva seus chats de 18 assistentes de IA em uma pasta local, com busca e exportações em todos os formatos. O Pro adiciona a sincronização de todas as IAs em um clique e exportações com a cara dos sites originais."
  pro_status: Pro — lançamento em breve
  free_features:
