  howpro_h2: Como o Pro funciona
  howpro_p: Sem conta para criar e sem senha. Sua chave de licença é o seu login.
  howpro_steps:
  - t: Escolha um plano
    d: Clique em “Obter Pro” aqui ou em “Fazer upgrade” dentro da extensão. Abre-se um checkout seguro da Freemius. Pague com cartão ou PayPal.
  - t: Receba sua chave de licença
    d: Ela aparece na hora na tela de agradecimento e é enviada para o e-mail que você usou no checkout.
  - t: Ative na extensão
    d: Abra o Pro, cole sua chave e clique em “Ativar”. Você verá “Conectado como” com seu e-mail, seu plano e a data de renovação.
  - t: Gerencie quando quiser
    d: Use “Gerenciar conta” para ver faturas, cancelar ou encontrar sua chave de novo. Saia em um dispositivo para usar o Pro em outro.
  fine: Os pagamentos e as chaves de licença do Pro são processados pelo nosso revendedor e comerciante registrado, Freemius, Inc. Impostos podem ser adicionados no checkout, dependendo de onde você mora. Veja os <a href="%terms_url%">Termos de Serviço</a> (em inglês). Os direitos legais do consumidor, quando aplicáveis, não são afetados.
