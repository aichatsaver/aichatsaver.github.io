  - "Central de Comandos para ver seus chats"
  - "Salve manualmente o chat aberto"
  - "8 chats novos por dia"
  - "8 exportações por dia, qualquer formato"
  - "Studio e destaques"
  - "Mídia de todas as IAs (exceto Grok)"
  - "Salva em Downloads"
  - "Pequeno logo como marca d'água"
