  h1_c: .
  lede: "%name% é uma extensão de navegador que salva seus chats de 18 assistentes de IA em uma pasta no seu próprio computador. Salve o chat aberto em um clique; com o Pro, um clique sincroniza todas as IAs. Nada sai do seu dispositivo."
  hero_note: Para Google Chrome e Microsoft Edge.
  ais_h2: Funciona com 18 IAs
  ais_p: Entre nas IAs que você usa no navegador, como sempre. O %name% salva os chats de cada uma em sua própria pasta.
  features_h2: Tudo o que está no chat, não só o texto
  features_p: 'Seus chats viram arquivos reais que são seus: legíveis offline, pesquisáveis e prontos para exportar.'
  feat_save: "Salve com um clique em qualquer IA"
  feat_reader: "Código, tabelas e imagens preservados"
  feat_pdf: "PDFs que mantêm a formatação"
  feat_formats: "Word, HTML, Markdown e mais"
  feat_search: "Pesquise todos os chats na hora"
  feat_folders: "Pastas, etiquetas e estrelas"
  feat_highlights: "Destaques e notas privadas"
  feat_studio: "Export Studio, do seu jeito"
  feat_looks: "A aparência original de cada IA"
  feat_sync: "Sincronize todas as IAs com um clique"
  feat_grok: "Mídia do Grok e chats apagados"
  feat_ais: "Funciona com 18 IAs"
  pro_label: "Recurso Pro"
  how_h2: Como funciona
  steps:
  - t: Instale a extensão
    d: Adicione ao Chrome ou ao Edge e fixe o ícone.
  - t: Continue conectado às suas IAs
    d: Use os sites de IA no mesmo perfil do navegador, como você já faz.
  - t: "Salve seus chats"
    d: "Salve o chat aberto na página de qualquer IA. Com o Pro, clique em Sincronizar tudo; só os chats novos e alterados são salvos."
  help_eyebrow: "Ajuda"
  help_h2: "Como obter o Pro"
  help_p: "Assista ao tour de 30 segundos ou siga os passos abaixo."
  help_steps:
  - t: "Escolha um plano"
    d: "Clique em «Obter Pro» na página de preços ou em «Upgrade» dentro da extensão."
  - t: "Pague com segurança"
    d: "O checkout da Freemius é aberto. Pague com cartão ou PayPal."
  - t: "Copie sua chave de licença"
    d: "Ela aparece na tela de agradecimento e chega por e-mail."
  - t: "Ative-a"
    d: "Na extensão, abra Configurações, cole a chave e clique em «Ativar». O Pro fica ativo."
  help_more: "Ainda com dúvidas? Escreva para <a href=\"mailto:%email%\">%email%</a> e ajudamos você."
  help_video: "Vídeo: como obter o Pro e ativar sua chave de licença"
  priv_eyebrow: Privacidade
  priv_h2: Seus chats nunca chegam até nós
  priv_p: O %name% lê seus chats pelo seu navegador, a partir dos sites de IA em que você está conectado, e os grava apenas na sua própria pasta e no armazenamento local do navegador. Leia a <a href="%privacy_url%">Política de Privacidade</a> completa (em inglês).
  priv_items:
  - Nenhum conteúdo de chat é enviado ao desenvolvedor
  - Sem análises nem rastreamento
  - Nunca vendemos dados
  - Desinstale ou apague a pasta para remover tudo
  faq_h2: Perguntas
  faq:
  - q: Preciso de uma conta?
    a: Não. O %name% usa as sessões que você já tem em cada site de IA. O Pro usa uma chave de licença do nosso parceiro de pagamentos, a Freemius. Cole-a na extensão uma vez e pronto, você está conectado.
  - q: Onde meus chats são salvos?
    a: "Em Downloads/AI Chat Saver. Com o Pro, você pode escolher qualquer pasta."
  - q: O que acontece se um site de IA mudar?
    a: Depois de cada sincronização, a extensão verifica todas as IAs. Se um site mudou e o salvamento parar de funcionar, você recebe uma notificação e um aviso, e uma execução com falha nunca sobrescreve um chat salvo corretamente.
  - q: É grátis?
    a: Sim, existe um plano Free. %pro_status%. Veja os <a href="%pricing_url%">Preços</a>.
  - q: "Posso pedir reembolso?"
    a: "Pro Anual: reembolso total em até 7 dias após o primeiro pagamento. O Pro Mensal não é reembolsável, mas você pode cancelar a qualquer momento e mantém o Pro até o fim do mês pago."
  - q: Perdi minha chave de licença ou digitei o e-mail errado
    a: Escreva para <a href="mailto:%email%">%email%</a> com o seu recibo de pagamento. Vamos corrigir o e-mail da sua licença e enviar a chave novamente.
  cta_h2: Guarde cada conversa
