  title: Preços
  description: Preços do AI Chat Saver — um plano Free e um plano Pro, mensal ou anual.
  eyebrow: Preços
  h1: Planos simples
  intro: Comece de graça. O Pro vai trazer mais quando for lançado. Os preços estão em %currency%.
