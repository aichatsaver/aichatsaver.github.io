  howpro_h2: Comment fonctionne Pro
  howpro_p: Aucun compte à créer, aucun mot de passe. Votre clé de licence sert d’identifiant.
  howpro_steps:
  - t: Choisissez un forfait
    d: Cliquez sur « Obtenir Pro » ici ou sur « Passer à Pro » dans l’extension. Un paiement sécurisé par Freemius s’ouvre. Payez par carte ou PayPal.
  - t: Recevez votre clé de licence
    d: Elle s’affiche aussitôt sur l’écran de remerciement et vous est envoyée par e-mail à l’adresse utilisée lors du paiement.
  - t: Activez-la dans l’extension
    d: Ouvrez Pro, collez votre clé et cliquez sur « Activer ». Vous verrez « Connecté en tant que » avec votre e-mail, votre forfait et sa date de renouvellement.
  - t: Gérez à tout moment
    d: Utilisez « Gérer le compte » pour voir vos factures, résilier ou retrouver votre clé. Déconnectez-vous sur un appareil pour utiliser Pro sur un autre.
  fine: Les paiements et les clés de licence de Pro sont gérés par notre revendeur et marchand officiel, Freemius, Inc. Des taxes peuvent s’ajouter au paiement selon votre lieu de résidence. Consultez les <a href="%terms_url%">Conditions d’utilisation</a> (en anglais). Les droits légaux des consommateurs, lorsqu’ils s’appliquent, ne sont pas affectés.
