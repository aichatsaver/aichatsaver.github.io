  tagline: Enregistrez chaque conversation d’IA dans un dossier sur votre propre ordinateur.
  description: "AI Chat Saver est une extension de navigateur qui enregistre vos chats de 18 assistants IA dans un dossier local, avec recherche et exports dans tous les formats. Pro ajoute la synchronisation de toutes les IA en un clic et des exports fidèles aux sites d’origine."
