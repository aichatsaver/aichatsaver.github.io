meta:
  tagline: احفظ كل محادثة ذكاء اصطناعي في مجلد على حاسوبك.
  description: AI Chat Saver إضافة للمتصفح تحفظ محادثاتك من 18 مساعدًا للذكاء الاصطناعي في مجلد محلي، مع تحديث بنقرة واحدة وبحث وتصدير يبدو مثل المواقع الأصلية.
  pro_status: Pro — يُطلق قريبًا
  free_features:
  - احفظ المحادثات من جميع خدمات الذكاء الاصطناعي الـ18 المدعومة
  - مجلد محلي على حاسوبك (التنزيلات أو مجلد تربطه)
  - تحديث تدريجي بنقرة واحدة، مع جداول زمنية
  - الاحتفاظ بالصور والفيديوهات والملفات والتفكير والشيفرة والمصادر والعناصر المُنشأة
  - التصدير إلى PDF وWord (DOCX) وHTML وMarkdown وTXT وJSON وPNG وJPG
  - بحث في النص الكامل ومركز الأوامر
  - كل شيء يبقى على جهازك
  pro_features:
  - كل ما في Free
  - سيُعلن عن ميزات Pro الحصرية عند الإطلاق
home:
  title: المنتج
  logo_alt: شعار %name%
  h1_a: 'كل محادثة ذكاء اصطناعي، '
  h1_b: محفوظة على حاسوبك
  h1_c: .
  lede: '%name% إضافة للمتصفح تحفظ محادثاتك من 18 مساعدًا للذكاء الاصطناعي في مجلد على حاسوبك. نقرة واحدة تبقيه محدّثًا، ولا شيء يغادر جهازك.'
  hero_note: لمتصفحي Google Chrome وMicrosoft Edge.
  ais_h2: يعمل مع 18 خدمة ذكاء اصطناعي
  ais_p: سجّل الدخول كالمعتاد إلى خدمات الذكاء الاصطناعي التي تستخدمها في متصفحك. يحفظ %name% محادثات كل خدمة في مجلدها الخاص.
  features_h2: كل ما في المحادثة، لا النص فقط
  features_p: 'تصبح محادثاتك ملفات حقيقية تملكها: تُقرأ دون اتصال، ويمكن البحث فيها، وجاهزة للتصدير.'
  f1_h: مجلد محلي تملكه
  f1_p: تُكتب المحادثات في <strong>Downloads/AI Chat Saver</strong>، مجلد لكل خدمة، بصيغ Markdown وHTML وJSON، والوسائط بجانبها. أو اربط مجلدًا مرة واحدة لتُحفظ الملفات فيه مباشرة، دون نوافذ «حفظ باسم».
  f2_h: تحديث تدريجي بنقرة واحدة
  f2_p: زر تحديث واحد يزامن كل الخدمات ويحفظ فقط المحادثات الجديدة أو المعدّلة، فلا يُنزَّل شيء مرتين. شغّله من النافذة المنبثقة، أو اضغط <kbd>Alt+Shift+U</kbd>، أو جدوِله كل ساعة أو كل 6 ساعات أو يوميًا أو أسبوعيًا.
  f3_h: الاحتفاظ بالوسائط والتفكير والشيفرة والعناصر المُنشأة
  f3_items:
  - الصور والفيديوهات والملفات المرفوعة والمُنشأة
  - التفكير والاستدلال، واستدعاءات الأدوات، والشيفرة التي شغّلها الذكاء الاصطناعي ومخرجاتها
  - مصادر الويب والاستشهادات
  - Artifacts في Claude وCanvas في ChatGPT كملفات حقيقية
  - الرسائل المحذوفة من الموقع تبقى مع علامة «محذوفة من الموقع»؛ والطلبات المعدّلة تُحفظ كإصدارات
  f4_h: تصدير يشبه الأصل
  f4_p: صدّر إلى <strong>HTML وMarkdown وPDF وWord (DOCX) وTXT</strong>، إضافة إلى JSON وPNG وJPG. يمكن لكل تصدير أن يحتفظ بمظهر موقع الذكاء الاصطناعي نفسه، فاتحًا أو داكنًا. تُنشأ ملفات PDF على حاسوبك بنص حقيقي قابل للتحديد، دون نافذة طباعة.
  f5_h: البحث ومركز الأوامر
  f5_p: 'اضغط <kbd>%shortcut%</kbd> لفتح مركز الأوامر بملء الشاشة: بحث فوري في النص الكامل عبر كل الخدمات، ومرشحات مثل <code>provider:</code> و<code>has:code</code>، ولوحة أوامر (<kbd>Ctrl+K</kbd>)، وخط زمني، وتظليلات وملاحظات، ووضع القراءة.'
  f6_h: الخصوصية في الأساس
  f6_p: 'كل شيء يعمل في متصفحك باستخدام جلسات تسجيل الدخول الخاصة بك. تبقى محادثاتك على جهازك: لا حساب لدينا، ولا خوادم، ولا تحليلات.'
  how_h2: كيف يعمل
  steps:
  - t: ثبّت الإضافة
    d: أضفها إلى Chrome أو Edge وثبّت أيقونتها.
  - t: ابقَ مسجّلًا في خدمات الذكاء الاصطناعي
    d: استخدم مواقع الذكاء الاصطناعي في ملف المتصفح نفسه، كما تفعل الآن.
  - t: اضغط «تحديث»
    d: تُحفظ محادثاتك في مجلدك. اضغطه مجددًا متى شئت؛ لا تُحفظ إلا المحادثات الجديدة والمعدّلة.
  priv_eyebrow: الخصوصية
  priv_h2: محادثاتك لا تصل إلينا أبدًا
  priv_p: يقرأ %name% محادثاتك عبر متصفحك من مواقع الذكاء الاصطناعي التي سجّلت الدخول إليها، ويكتبها فقط في مجلدك الخاص وفي التخزين المحلي لمتصفحك. اقرأ <a href="%privacy_url%">سياسة الخصوصية</a> كاملة (بالإنجليزية).
  priv_items:
  - لا يُرسل أي محتوى من المحادثات إلى المطوّر
  - لا تحليلات ولا تتبّع
  - لا بيع للبيانات، أبدًا
  - ألغِ التثبيت أو احذف المجلد لإزالة كل شيء
  faq_h2: أسئلة
  faq:
  - q: هل أحتاج إلى حساب؟
    a: لا. يستخدم %name% الجلسات الموجودة لديك أصلًا في كل موقع ذكاء اصطناعي. يعمل Pro بمفتاح ترخيص من شريك الدفع لدينا، Freemius. الصقه في الإضافة مرة واحدة وستكون مسجّلًا الدخول.
  - q: أين تُحفظ محادثاتي؟
    a: في Downloads/AI Chat Saver على حاسوبك (مجلد لكل خدمة)، أو في مجلد تربطه. وتُحفظ نسخة أيضًا في التخزين المحلي لمتصفحك ليكون البحث فوريًا.
  - q: ماذا يحدث إذا تغيّر موقع ذكاء اصطناعي؟
    a: بعد كل مزامنة تفحص الإضافة كل الخدمات. إذا تغيّر موقع وتوقّف الحفظ عن العمل، يصلك إشعار واحد وشريط تنبيه، ولا تستبدل أي عملية فاشلة محادثة محفوظة بشكل سليم.
  - q: هل هو مجاني؟
    a: نعم، هناك خطة Free. %pro_status%. راجع <a href="%pricing_url%">الأسعار</a>.
  - q: فقدت مفتاح الترخيص أو كتبت بريدًا إلكترونيًا خاطئًا
    a: راسلنا على <a href="mailto:%email%">%email%</a> مع إيصال الدفع. سنصحّح البريد الإلكتروني في ترخيصك ونرسل لك المفتاح مجددًا.
  cta_h2: احتفظ بكل محادثة
