  - t: أدِر اشتراكك في أي وقت
    d: استخدم «إدارة الحساب» لعرض الفواتير أو الإلغاء أو العثور على مفتاحك مجددًا. سجّل الخروج على جهاز لتستخدم Pro على جهاز آخر.
  fine: تتولى Freemius, Inc.، الموزّع والتاجر المسجّل لدينا، عمليات الدفع ومفاتيح الترخيص الخاصة بـ Pro. قد تُضاف ضرائب عند الدفع بحسب مكان إقامتك. راجع <a href="%terms_url%">شروط الخدمة</a> (بالإنجليزية). لا تتأثر حقوق المستهلك القانونية حيثما تنطبق.
