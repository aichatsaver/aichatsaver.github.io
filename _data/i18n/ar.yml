  - q: هل أحتاج إلى حساب؟
    a: لا. يستخدم %name% الجلسات الموجودة لديك أصلًا في كل موقع ذكاء اصطناعي. يعمل Pro بمفتاح ترخيص من شريك الدفع لدينا، Freemius. الصقه في الإضافة مرة واحدة وستكون مسجّلًا الدخول.
  - q: أين تُحفظ محادثاتي؟
    a: "في Downloads/AI Chat Saver. ومع Pro يمكنك اختيار أي مجلد."
  - q: ماذا يحدث إذا تغيّر موقع ذكاء اصطناعي؟
    a: بعد كل مزامنة تفحص الإضافة كل الخدمات. إذا تغيّر موقع وتوقّف الحفظ عن العمل، يصلك إشعار واحد وشريط تنبيه، ولا تستبدل أي عملية فاشلة محادثة محفوظة بشكل سليم.
  - q: هل هو مجاني؟
    a: نعم، هناك خطة Free. %pro_status%. راجع <a href="%pricing_url%">الأسعار</a>.
  - q: "هل يمكنني استرداد المبلغ؟"
    a: "Pro السنوي: استرداد كامل خلال 7 أيام من أول دفعة. أما Pro الشهري فغير قابل للاسترداد، لكن يمكنك الإلغاء في أي وقت ويبقى Pro فعّالًا حتى نهاية الشهر المدفوع."
  - q: فقدت مفتاح الترخيص أو كتبت بريدًا إلكترونيًا خاطئًا
    a: راسلنا على <a href="mailto:%email%">%email%</a> مع إيصال الدفع. سنصحّح البريد الإلكتروني في ترخيصك ونرسل لك المفتاح مجددًا.
  cta_h2: احتفظ بكل محادثة
