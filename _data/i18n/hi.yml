  - अपलोड की गई और बनाई गई इमेज, वीडियो और फ़ाइलें
  - थिंकिंग और रीज़निंग, टूल कॉल, AI का चलाया कोड और उसका आउटपुट
  - वेब स्रोत और साइटेशन
  - Claude आर्टिफ़ैक्ट और ChatGPT कैनवस असली फ़ाइलों के रूप में
  - साइट पर डिलीट हुए मैसेज बने रहते हैं, “साइट पर डिलीट” के निशान के साथ; एडिट किए गए प्रॉम्प्ट वर्ज़न के रूप में रखे जाते हैं
  f4_h: एक्सपोर्ट जो असली जैसे दिखें
  f4_p: <strong>HTML, Markdown, PDF, Word (DOCX) और TXT</strong> में एक्सपोर्ट करें, साथ ही JSON, PNG और JPG में भी। हर एक्सपोर्ट AI साइट का अपना लुक लाइट या डार्क में बनाए रख सकता है। PDF आपके कंप्यूटर पर ही असली, सेलेक्ट किए जा सकने वाले टेक्स्ट के साथ बनती हैं, बिना प्रिंट डायलॉग के।
  f5_h: सर्च और कमांड सेंटर
  f5_p: 'फ़ुल-स्क्रीन कमांड सेंटर खोलने के लिए <kbd>%shortcut%</kbd> दबाएँ: हर AI में तुरंत फ़ुल-टेक्स्ट सर्च, <code>provider:</code> और <code>has:code</code> जैसे फ़िल्टर, कमांड पैलेट (<kbd>Ctrl+K</kbd>), टाइमलाइन, हाइलाइट और नोट्स, और रीडिंग मोड।'
  f6_h: शुरू से ही निजी
  f6_p: 'सब कुछ आपके ब्राउज़र में, आपके अपने साइन-इन सेशन से चलता है। आपकी चैट आपके डिवाइस पर रहती हैं: हमारे पास कोई अकाउंट नहीं, कोई सर्वर नहीं, कोई एनालिटिक्स नहीं।'
  how_h2: यह कैसे काम करता है
