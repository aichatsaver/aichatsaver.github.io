  - चैट की कोई भी सामग्री डेवलपर को नहीं भेजी जाती
  - कोई एनालिटिक्स या ट्रैकिंग नहीं
  - डेटा की बिक्री कभी नहीं
  - सब कुछ हटाने के लिए अनइंस्टॉल करें या फ़ोल्डर डिलीट करें
  faq_h2: सवाल
  faq:
  - q: क्या मुझे अकाउंट चाहिए?
    a: नहीं। %name% हर AI साइट पर आपके पहले से मौजूद सेशन का इस्तेमाल करता है। Pro हमारे पेमेंट पार्टनर Freemius की लाइसेंस की से चलता है। इसे एक बार एक्सटेंशन में पेस्ट करें और आप साइन इन हो जाएँगे।
  - q: मेरी चैट कहाँ सेव होती हैं?
    a: आपके कंप्यूटर पर Downloads/AI Chat Saver में (हर AI का एक फ़ोल्डर), या आपके जोड़े हुए फ़ोल्डर में। एक कॉपी आपके ब्राउज़र के लोकल स्टोरेज में भी रहती है ताकि सर्च तुरंत हो।
  - q: अगर कोई AI साइट बदल जाए तो क्या होगा?
    a: हर सिंक के बाद एक्सटेंशन हर AI को जाँचता है। अगर कोई साइट बदल गई और सेव होना बंद हो गया, तो आपको एक नोटिफ़िकेशन और एक बैनर मिलेगा, और कोई गड़बड़ रन कभी भी सही सेव हुई चैट को ओवरराइट नहीं करता।
  - q: क्या यह मुफ़्त है?
    a: हाँ, एक Free प्लान है। %pro_status%। <a href="%pricing_url%">कीमतें</a> देखें।
  - q: मेरी लाइसेंस की खो गई या ईमेल गलत टाइप हो गया
    a: अपनी पेमेंट रसीद के साथ <a href="mailto:%email%">%email%</a> पर ईमेल करें। हम आपके लाइसेंस का ईमेल ठीक कर देंगे और की दोबारा भेज देंगे।
  cta_h2: हर बातचीत सँभालकर रखें
