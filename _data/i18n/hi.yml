  - t: एक्सटेंशन इंस्टॉल करें
    d: इसे Chrome या Edge में जोड़ें और आइकन पिन करें।
  - t: अपने AI में साइन इन रहें
    d: AI साइटों को उसी ब्राउज़र प्रोफ़ाइल में इस्तेमाल करें, जैसे आप पहले से करते हैं।
  - t: अपडेट दबाएँ
    d: आपकी चैट आपके फ़ोल्डर में सेव हो जाती हैं। जब चाहें फिर से दबाएँ; सिर्फ़ नई और बदली हुई चैट सेव होती हैं।
  priv_eyebrow: गोपनीयता
  priv_h2: आपकी चैट कभी हम तक नहीं आतीं
  priv_p: '%name% आपकी चैट आपके ब्राउज़र के ज़रिए उन AI साइटों से पढ़ता है जिनमें आप साइन इन हैं, और उन्हें सिर्फ़ आपके अपने फ़ोल्डर और ब्राउज़र के लोकल स्टोरेज में लिखता है। पूरी <a href="%privacy_url%">गोपनीयता नीति</a> पढ़ें (अंग्रेज़ी में)।'
