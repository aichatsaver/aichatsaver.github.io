  features_h2: चैट की हर चीज़, सिर्फ़ टेक्स्ट नहीं
  features_p: 'आपकी चैट असली फ़ाइलें बन जाती हैं जो आपकी अपनी हैं: ऑफ़लाइन पढ़ने लायक, सर्च करने लायक, और एक्सपोर्ट के लिए तैयार।'
  f1_h: आपका अपना लोकल फ़ोल्डर
  f1_p: चैट <strong>Downloads/AI Chat Saver</strong> में लिखी जाती हैं, हर AI का एक फ़ोल्डर, Markdown, HTML और JSON में, साथ में मीडिया भी। या एक बार कोई फ़ोल्डर जोड़ दें और फ़ाइलें सीधे उसी में सेव होंगी, बिना किसी “Save As” बॉक्स के।
  f2_h: एक क्लिक में इंक्रीमेंटल अपडेट
  f2_p: एक ही अपडेट बटन हर AI को सिंक करता है और सिर्फ़ नई या बदली हुई चैट सेव करता है, इसलिए कुछ भी दो बार डाउनलोड नहीं होता। इसे पॉपअप से चलाएँ, <kbd>Alt+Shift+U</kbd> दबाएँ, या हर घंटे, हर 6 घंटे, रोज़ या हर हफ़्ते के लिए शेड्यूल करें।
  f3_h: मीडिया, थिंकिंग, कोड और आर्टिफ़ैक्ट सुरक्षित
