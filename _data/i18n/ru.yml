meta:
  tagline: Сохраняйте каждый чат с ИИ в папку на своём компьютере.
  description: 'AI Chat Saver — расширение для браузера, которое сохраняет ваши чаты из 18 ИИ-ассистентов в локальную папку: обновление в один клик, поиск и экспорт, который выглядит как оригинальные сайты.'
  pro_status: Pro — скоро запуск
  free_features:
  - "Сохранение чатов из всех 18 поддерживаемых ИИ"
  - "8 новых чатов в день суммарно по всем ИИ. Повторное сохранение уже сохранённого чата не считается."
  - "Сохранение вручную, по одному открытому чату, прямо на странице этого ИИ"
  - "Изображения, файлы и медиа из всех ИИ (кроме изображений и медиа Grok)"
  - "8 экспортов в день в любом формате (PDF, Word, HTML, Markdown, TXT, JSON, PNG, JPG)"
  - "В сохранённых и экспортированных файлах есть небольшой логотип AI Chat Saver и ссылка на расширение для Chrome"
  - "Чаты сохраняются в Downloads/AI Chat Saver"
  - "Читайте, ищите и просматривайте сохранённые чаты в Командном центре, плюс Studio и выделения"
  - "Всё остаётся на вашем устройстве"
  pro_features:
  - "Всё, что есть в Free"
  - "Безлимитные сохранения и экспорт"
  - "Без водяного знака"
  - "Сохранение и синхронизация из Командного центра, в том числе массово через «Синхронизировать всё»"
  - "Автосинхронизация, инкрементальные обновления и расписания"
  - "Изображения и медиа Grok, а также восстановление удалённых чатов Grok"
  - "Любая папка на вашем компьютере"
  - "Один лицензионный ключ на устройство"
home:
  title: Продукт
  logo_alt: Логотип %name%
  h1_a: 'Каждый чат с ИИ — '
  h1_b: на вашем компьютере
  h1_c: .
  lede: '%name% — расширение для браузера, которое сохраняет ваши чаты из 18 ИИ-ассистентов в папку на вашем собственном компьютере. Один клик — и всё актуально, а данные никогда не покидают ваше устройство.'
  hero_note: Для Google Chrome и Microsoft Edge.
  ais_h2: Работает с 18 ИИ
  ais_p: Входите в свои ИИ в браузере как обычно. %name% сохраняет чаты каждого из них в отдельную папку.
  features_h2: Весь чат, а не только текст
  features_p: 'Ваши чаты становятся настоящими файлами, которые принадлежат вам: их можно читать офлайн, искать по ним и экспортировать.'
  f1_h: Ваша собственная локальная папка
  f1_p: Чаты записываются в <strong>Downloads/AI Chat Saver</strong>, по папке на каждый ИИ, в форматах Markdown, HTML и JSON, а медиафайлы — рядом. Или подключите папку один раз, и файлы будут сохраняться прямо в неё, без окон «Сохранить как».
  f2_h: Инкрементальное обновление в один клик
  f2_p: 'Одна кнопка обновления синхронизирует все ИИ и сохраняет только новые или изменённые чаты, поэтому ничего не скачивается дважды. Запускайте из всплывающего окна, нажмите <kbd>Alt+Shift+U</kbd> или настройте расписание: каждый час, каждые 6 часов, ежедневно или еженедельно.'
  f3_h: Медиа, рассуждения, код и артефакты сохраняются
  f3_items:
  - Загруженные и сгенерированные изображения, видео и файлы
  - Рассуждения, вызовы инструментов, код, который запускал ИИ, и его вывод
  - Веб-источники и цитаты
  - Артефакты Claude и холсты ChatGPT в виде настоящих файлов
  - Сообщения, удалённые на сайте, остаются с пометкой «Удалено на сайте»; отредактированные запросы сохраняются как версии
  f4_h: Экспорт, как в оригинале
  f4_p: Экспортируйте в <strong>HTML, Markdown, PDF, Word (DOCX) и TXT</strong>, а также в JSON, PNG и JPG. Каждый экспорт может сохранять оформление самого сайта ИИ — в светлой или тёмной теме. PDF создаются на вашем компьютере с настоящим текстом, который можно выделять, без диалога печати.
  f5_h: Поиск и Командный центр
  f5_p: 'Нажмите <kbd>%shortcut%</kbd>, чтобы открыть полноэкранный Командный центр: мгновенный полнотекстовый поиск по всем ИИ, фильтры вроде <code>provider:</code> и <code>has:code</code>, палитра команд (<kbd>Ctrl+K</kbd>), хронология, выделения и заметки, а также режим чтения.'
  f6_h: Приватность в основе
  f6_p: 'Всё работает в вашем браузере через ваши собственные активные сессии. Ваши чаты остаются на вашем устройстве: без аккаунта у нас, без серверов, без аналитики.'
  how_h2: Как это работает
  steps:
  - t: Установите расширение
    d: Добавьте его в Chrome или Edge и закрепите значок.
  - t: Оставайтесь в своих ИИ
    d: Пользуйтесь сайтами ИИ в том же профиле браузера, как и раньше.
  - t: Нажмите «Обновить»
    d: Ваши чаты сохраняются в вашу папку. Нажимайте снова в любое время — сохраняются только новые и изменённые чаты.
  priv_eyebrow: Приватность
  priv_h2: Ваши чаты никогда не попадают к нам
  priv_p: '%name% читает ваши чаты через браузер с тех сайтов ИИ, в которые вы вошли, и записывает их только в вашу собственную папку и в локальное хранилище браузера. Прочитайте полную <a href="%privacy_url%">Политику конфиденциальности</a> (на английском).'
  priv_items:
  - Содержимое чатов не отправляется разработчику
  - Никакой аналитики и отслеживания
  - Никакой продажи данных — никогда
  - Удалите расширение или папку, чтобы стереть всё
  faq_h2: Вопросы
  faq:
  - q: Нужен ли мне аккаунт?
    a: Нет. %name% использует сессии, которые у вас уже есть на каждом сайте ИИ. Pro работает по лицензионному ключу от нашего платёжного партнёра Freemius. Вставьте его в расширение один раз — и вы вошли.
  - q: Где сохраняются мои чаты?
    a: "В папке Downloads/AI Chat Saver на вашем компьютере (по папке на каждый ИИ). С Pro можно выбрать любую папку на компьютере. Копия также хранится в локальном хранилище браузера, чтобы поиск работал мгновенно."
  - q: Что будет, если сайт ИИ изменится?
    a: После каждой синхронизации расширение проверяет все ИИ. Если сайт изменился и сохранение перестало работать, вы получите одно уведомление и баннер, а неудачный запуск никогда не перезапишет успешно сохранённый чат.
  - q: Это бесплатно?
    a: Да, есть тариф Free. %pro_status%. Смотрите <a href="%pricing_url%">Цены</a>.
  - q: Потерялся лицензионный ключ или email указан с ошибкой
    a: Напишите на <a href="mailto:%email%">%email%</a> и приложите квитанцию об оплате. Мы исправим email в вашей лицензии и отправим ключ повторно.
  cta_h2: Сохраните каждый разговор
pricing:
  title: Цены
  description: Цены AI Chat Saver — тариф Free и тариф Pro, помесячно или на год.
  eyebrow: Цены
  h1: Простые тарифы
  intro: Начните бесплатно. После запуска Pro добавит больше возможностей. Цены указаны в %currency%.
  free_h: Free
  free_sub: Всё, что нужно, чтобы сохранить ваши чаты.
