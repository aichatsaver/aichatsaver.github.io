    d: Добавьте его в Chrome или Edge и закрепите значок.
  - t: Оставайтесь в своих ИИ
    d: Пользуйтесь сайтами ИИ в том же профиле браузера, как и раньше.
  - t: "Сохраняйте чаты"
    d: "Сохраните открытый чат на странице любого ИИ. С Pro нажмите «Синхронизировать всё» — сохраняются только новые и изменённые чаты."
  help_eyebrow: "Помощь"
  help_h2: "Как получить Pro"
  help_p: "Посмотрите 30-секундный обзор или выполните шаги ниже."
  help_steps:
  - t: "Выберите план"
    d: "Нажмите «Получить Pro» на странице цен или «Улучшить» в расширении."
  - t: "Оплатите безопасно"
    d: "Откроется оплата Freemius. Платите картой или через PayPal."
  - t: "Скопируйте лицензионный ключ"
    d: "Он появится на странице благодарности и придёт на почту."
  - t: "Активируйте его"
    d: "В расширении откройте «Настройки», вставьте ключ и нажмите «Активировать». Pro включён."
  help_more: "Остались вопросы? Напишите на <a href=\"mailto:%email%\">%email%</a>, мы поможем."
  help_video: "Видео: как получить Pro и активировать лицензионный ключ"
  priv_eyebrow: Приватность
  priv_h2: Ваши чаты никогда не попадают к нам
  priv_p: '%name% читает ваши чаты через браузер с тех сайтов ИИ, в которые вы вошли, и записывает их только в вашу собственную папку и в локальное хранилище браузера. Прочитайте полную <a href="%privacy_url%">Политику конфиденциальности</a> (на английском).'
  priv_items:
  - Содержимое чатов не отправляется разработчику
  - Никакой аналитики и отслеживания
  - Никакой продажи данных — никогда
  - Удалите расширение или папку, чтобы стереть всё
  faq_h2: Вопросы
  faq:
  - q: Нужен ли мне аккаунт?
    a: Нет. %name% использует сессии, которые у вас уже есть на каждом сайте ИИ. Pro работает по лицензионному ключу от нашего платёжного партнёра Freemius. Вставьте его в расширение один раз — и вы вошли.
  - q: Где сохраняются мои чаты?
    a: "В Downloads/AI Chat Saver. С Pro можно выбрать любую папку."
  - q: Что будет, если сайт ИИ изменится?
    a: После каждой синхронизации расширение проверяет все ИИ. Если сайт изменился и сохранение перестало работать, вы получите одно уведомление и баннер, а неудачный запуск никогда не перезапишет успешно сохранённый чат.
  - q: Это бесплатно?
    a: Да, есть тариф Free. %pro_status%. Смотрите <a href="%pricing_url%">Цены</a>.
  - q: "Можно ли вернуть деньги?"
    a: "Pro на год: полный возврат в течение 7 дней после первого платежа. Pro на месяц не возвращается, но вы можете отменить подписку в любой момент и пользоваться Pro до конца оплаченного месяца."
  - q: Потерялся лицензионный ключ или email указан с ошибкой
    a: Напишите на <a href="mailto:%email%">%email%</a> и приложите квитанцию об оплате. Мы исправим email в вашей лицензии и отправим ключ повторно.
  cta_h2: Сохраните каждый разговор
