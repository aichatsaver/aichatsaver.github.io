  howpro_p: Не нужно создавать аккаунт и придумывать пароль. Ваш лицензионный ключ и есть ваш вход.
  howpro_steps:
  - t: Выберите тариф
    d: Нажмите «Получить Pro» здесь или «Улучшить» в расширении. Откроется защищённая оплата Freemius. Платите картой или через PayPal.
  - t: Получите лицензионный ключ
    d: Он сразу появится на странице благодарности и придёт на email, указанный при оплате.
  - t: Активируйте в расширении
    d: Откройте Pro, вставьте ключ и нажмите «Активировать». Вы увидите «Вход выполнен как» с вашим email, тарифом и датой продления.
  - t: Управляйте в любое время
    d: В разделе «Управление аккаунтом» можно посмотреть счета, отменить подписку или снова найти ключ. Выйдите на одном устройстве, чтобы пользоваться Pro на другом.
  fine: Платежи и лицензионные ключи Pro обрабатывает наш реселлер и официальный продавец (merchant of record) — Freemius, Inc. В зависимости от места проживания при оплате могут добавляться налоги. См. <a href="%terms_url%">Условия использования</a> (на английском). Законные права потребителей, где они применимы, не затрагиваются.
