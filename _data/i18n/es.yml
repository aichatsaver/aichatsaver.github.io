  feat_ais_d: "ChatGPT, Claude, Gemini, Grok y 14 más."
  pro_label: "Función Pro"
  how_h2: Cómo funciona
  steps:
  - t: Instala la extensión
    d: Añádela a Chrome y fija el icono.
  - t: Mantén la sesión iniciada en tus IA
    d: Usa los sitios de IA en el mismo perfil del navegador, como ya haces.
  - t: "Guarda tus chats"
    d: "Guarda el chat que tienes abierto en la página de cualquier IA. Con Pro, pulsa Sincronizar todo; solo se guardan los chats nuevos y modificados."
  help_eyebrow: "Ayuda"
  help_h2: "Cómo obtener Pro"
  help_p: "Mira el recorrido de 30 segundos o sigue estos pasos."
  help_steps:
  - t: "Elige un plan"
    d: "Pulsa «Obtener Pro» en la página de precios o «Mejorar» dentro de la extensión."
  - t: "Paga de forma segura"
    d: "Se abre el pago de Freemius. Paga con tarjeta o PayPal."
  - t: "Copia tu clave de licencia"
    d: "Aparece en la pantalla de agradecimiento y te llega por correo."
  - t: "Actívala"
    d: "En la extensión, abre Ajustes, pega la clave y pulsa «Activar». Pro queda activado."
  help_more: "¿Sigues con dudas? Escribe a <a href=\"mailto:%email%\">%email%</a> y te ayudamos."
  help_video: "Vídeo: cómo obtener Pro y activar tu clave de licencia"
  priv_eyebrow: Privacidad
  priv_h2: Tus chats nunca llegan a nosotros
  priv_p: '%name% lee tus chats a través de tu navegador desde los sitios de IA en los que has iniciado sesión, y los escribe solo en tu propia carpeta y en el almacenamiento local de tu navegador. Lee la <a href="%privacy_url%">Política de privacidad</a> completa (en inglés).'
  priv_items:
  - No se envía ningún contenido de los chats al desarrollador
  - Sin analíticas ni rastreo
  - Nunca vendemos datos
  - Desinstala la extensión o borra la carpeta para eliminarlo todo
  faq_h2: Preguntas
  faq:
  - q: ¿Necesito una cuenta?
    a: No. %name% usa las sesiones que ya tienes en cada sitio de IA. Pro usa una clave de licencia de nuestro socio de pagos, Freemius. Pégala una vez en la extensión y ya tendrás la sesión iniciada.
  - q: ¿Dónde se guardan mis chats?
    a: "En Downloads/AI Chat Saver. Con Pro puedes elegir cualquier carpeta."
  - q: ¿Qué pasa si un sitio de IA cambia?
    a: Después de cada sincronización, la extensión comprueba todas las IA. Si un sitio ha cambiado y el guardado deja de funcionar, recibes una notificación y un aviso, y una ejecución fallida nunca sobrescribe un chat guardado correctamente.
  - q: ¿Es gratis?
    a: Sí, hay un plan Free. %pro_status%. Consulta los <a href="%pricing_url%">Precios</a>.
  - q: "¿Puedo pedir un reembolso?"
    a: "Pro Anual: reembolso completo dentro de los 7 días siguientes a tu primer pago. Pro Mensual no es reembolsable, pero puedes cancelar cuando quieras y mantienes Pro hasta el final del mes pagado."
  - q: Perdí mi clave de licencia o escribí mal el correo
    a: Escribe a <a href="mailto:%email%">%email%</a> con tu recibo de pago. Corregiremos el correo de tu licencia y te enviaremos la clave de nuevo.
  cta_h2: Conserva cada conversación
