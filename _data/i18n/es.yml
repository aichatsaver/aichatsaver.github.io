  howpro_h2: Cómo funciona Pro
  howpro_p: Sin cuenta que crear y sin contraseña. Tu clave de licencia es tu inicio de sesión.
  howpro_steps:
  - t: Elige un plan
    d: Pulsa «Obtener Pro» aquí o «Mejorar» dentro de la extensión. Se abre un pago seguro de Freemius. Paga con tarjeta o PayPal.
  - t: Recibe tu clave de licencia
    d: Aparece de inmediato en la pantalla de agradecimiento y se envía por correo a la dirección que usaste al pagar.
  - t: Actívala en la extensión
    d: Abre Pro, pega tu clave y pulsa «Activar». Verás «Sesión iniciada como» con tu correo, tu plan y su fecha de renovación.
  - t: Gestiónalo cuando quieras
    d: Usa «Gestionar cuenta» para ver facturas, cancelar o recuperar tu clave. Cierra la sesión en un dispositivo para usar Pro en otro.
  fine: Los pagos y las claves de licencia de Pro los gestiona nuestro revendedor y comerciante registrado, Freemius, Inc. Pueden añadirse impuestos al pagar según dónde vivas. Consulta los <a href="%terms_url%">Términos del servicio</a> (en inglés). No se ven afectados los derechos legales del consumidor, cuando sean aplicables.
