home:
  title: 产品
  logo_alt: '%name% 标志'
  h1_a: 每一段 AI 对话，
  h1_b: 都保存在你的电脑上
  h1_c: 。
  lede: "%name% 是一款浏览器扩展，可将你在 18 个 AI 助手中的聊天保存到你自己电脑上的文件夹。一键保存当前打开的聊天；使用 Pro，一键同步全部 AI。任何内容都不会离开你的设备。"
  hero_note: 适用于 Google Chrome 和 Microsoft Edge。
  ais_h2: 支持 18 个 AI
  ais_p: 像平时一样在浏览器中登录你使用的 AI。%name% 会把每个 AI 的对话分别保存到各自的文件夹。
  features_h2: 完整保存对话，不只是文字
  features_p: 你的对话会变成真正属于你的文件：可离线阅读、可搜索、可随时导出。
  f1_h: 属于你的本地文件夹
  f1_p: "聊天会写入 <strong>Downloads/AI Chat Saver</strong>，每个 AI 一个文件夹，格式为 Markdown、HTML 和 JSON，媒体文件放在一旁。Free 版在每个 AI 的页面上保存当前打开的聊天，每天最多 8 个新聊天。Pro 版不限次数保存，并可选择任意文件夹，没有“另存为”弹窗。"
  f2_h: "一键全部同步（Pro）"
  f2_p: "使用 Pro，<strong>全部同步</strong>一次保存所有 AI，<strong>全部更新</strong>只保存新的或有改动的聊天，不会重复下载。可在命令中心或弹出窗口中运行，按 <kbd>Alt+Shift+U</kbd>，或设置为每小时、每 6 小时、每天或每周自动运行。"
  f3_h: 保留媒体、思考过程、代码和 Artifacts
  f3_items:
  - "上传和生成的图片、视频和文件（Grok 媒体需 Pro）"
  - 思考与推理过程、工具调用、AI 运行的代码及其输出
  - 网页来源与引用
  - 以真实文件保存 Claude Artifacts 和 ChatGPT Canvas
  - 在网站上删除的消息仍会保留，并标记为“已在网站上删除”；编辑过的提示会作为不同版本保留
  f4_h: "导出所有格式"
  f4_p: "导出为 <strong>HTML、Markdown、PDF、Word（DOCX）和 TXT</strong>，以及 JSON、PNG 和 JPG，所有方案均可使用（Free：每天 8 次导出，带小标志）。使用 Pro，导出保留各 AI 网站原有外观，浅色或深色均可，且无标志。PDF 在你的电脑上生成，文字真实可选，无需打印对话框。"
  f5_h: 搜索与命令中心
  f5_p: 按 <kbd>%shortcut%</kbd> 打开全屏命令中心：在所有 AI 中即时全文搜索，使用 <code>provider:</code> 和 <code>has:code</code> 等筛选条件，还有命令面板（<kbd>Ctrl+K</kbd>）、时间线、高亮与笔记，以及阅读模式。
  f6_h: 隐私从设计开始
  f6_p: 一切都在你的浏览器中运行，使用你自己已登录的会话。你的对话只留在你的设备上：无需在我们这里注册账户，没有服务器，没有数据分析。
  how_h2: 使用方法
  steps:
  - t: 安装扩展
    d: 将其添加到 Chrome 或 Edge，并固定图标。
  - t: 保持 AI 的登录状态
    d: 像平常一样，在同一个浏览器配置文件中使用各个 AI 网站。
  - t: "保存你的聊天"
    d: "在任意 AI 的页面上保存当前打开的聊天。使用 Pro，点击“全部同步”，只保存新的和有改动的聊天。"
  priv_eyebrow: 隐私
  priv_h2: 你的对话永远不会传给我们
  priv_p: '%name% 通过你的浏览器，从你已登录的 AI 网站读取对话，并且只写入你自己的文件夹和浏览器的本地存储。阅读完整的<a href="%privacy_url%">隐私政策</a>（英文）。'
  priv_items:
  - 不会向开发者发送任何对话内容
  - 没有数据分析，也没有跟踪
  - 绝不出售数据
  - 卸载扩展或删除文件夹即可清除一切
  faq_h2: 常见问题
  faq:
  - q: 需要注册账户吗？
    a: 不需要。%name% 使用你在各个 AI 网站上已有的登录会话。Pro 使用我们的支付合作伙伴 Freemius 提供的许可证密钥。只需在扩展中粘贴一次，即可完成登录。
  - q: 我的对话保存在哪里？
    a: "保存在 Downloads/AI Chat Saver 中。使用 Pro 可选择任意文件夹。"
  - q: 如果某个 AI 网站改版了怎么办？
    a: 每次同步后，扩展都会检查所有 AI。如果某个网站改版导致无法保存，你会收到一条通知和一个提示横幅，而且失败的运行绝不会覆盖已正确保存的对话。
  - q: 是免费的吗？
    a: 是的，提供 Free 方案。%pro_status%。请查看<a href="%pricing_url%">价格</a>。
  - q: "可以退款吗？"
    a: "Pro 年付：首次付款后 7 天内可全额退款。Pro 月付不可退款，但你可以随时取消，Pro 会保留到已付费月份结束。"
  - q: 我丢失了许可证密钥或填错了邮箱
    a: 请附上付款收据，发送邮件至 <a href="mailto:%email%">%email%</a>。我们会更正你许可证上的邮箱，并重新发送密钥。
  cta_h2: 留住每一段对话
