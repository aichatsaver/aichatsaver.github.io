  howpro_h2: Pro 如何运作
  howpro_p: 无需创建账户，也无需密码。你的许可证密钥就是你的登录凭证。
  howpro_steps:
  - t: 选择方案
    d: 在此处点击“获取 Pro”，或在扩展内点击“升级”。将打开由 Freemius 提供的安全结账页面。可使用银行卡或 PayPal 付款。
  - t: 获取许可证密钥
    d: 密钥会立即显示在感谢页面上，并发送到你结账时使用的邮箱。
  - t: 在扩展中激活
    d: 打开 Pro，粘贴密钥并点击“激活”。你会看到“已登录为”以及你的邮箱、方案和续订日期。
  - t: 随时管理
    d: 使用“管理账户”查看发票、取消订阅或找回密钥。在一台设备上退出登录，即可在另一台设备上使用 Pro。
  fine: Pro 的付款和许可证密钥由我们的经销商兼记录商户 Freemius, Inc. 处理。根据你所在的地区，结账时可能会加收税费。请参阅<a href="%terms_url%">服务条款</a>（英文）。在适用的情况下，消费者的法定权利不受影响。
