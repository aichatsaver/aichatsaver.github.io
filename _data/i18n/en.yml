  title: Pricing
  description: AI Chat Saver pricing — a Free plan and a Pro plan, monthly or yearly.
  eyebrow: Pricing
  h1: Simple plans
  intro: Start free. Pro adds more when it launches. Prices are in %currency%.
  free_h: Free
