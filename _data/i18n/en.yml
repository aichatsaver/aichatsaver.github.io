home:
  title: Product
  logo_alt: '%name% logo'
  h1_a: 'Every AI chat, '
  h1_b: saved on your computer
  h1_c: .
  lede: "%name% is a browser extension that saves your chats from 18 AI assistants into a folder on your own computer. Save the chat you have open in one click; with Pro, one click syncs every AI. Nothing leaves your device."
  hero_note: For Google Chrome.
  ais_h2: Works with 18 AIs
  ais_p: Sign in to the AIs you use in your browser as usual. %name% saves the chats from each one into its own folder.
  features_h2: Everything in the chat, not just the text
  features_p: 'Your chats become real files you own: readable offline, searchable, and ready to export.'
  feat_save: "One-click save on any AI"
  feat_save_d: "Save the chat you're on with one click."
  feat_reader: "Code, tables and images kept"
  feat_reader_d: "Every code block, table and image, exactly as sent."
  feat_pdf: "PDFs that keep every format"
  feat_pdf_d: "Crisp, searchable PDFs, no print dialog."
  feat_formats: "Word, HTML, Markdown and more"
  feat_formats_d: "Export to Word, HTML, Markdown or plain text."
  feat_search: "Search every chat instantly"
  feat_search_d: "Find any chat or line in seconds."
  feat_folders: "Folders, tags and stars"
  feat_folders_d: "Organize chats with folders, tags and stars."
  feat_highlights: "Highlights and private notes"
  feat_highlights_d: "Mark key lines and add notes only you see."
  feat_studio: "Export Studio, your style"
  feat_studio_d: "Pick fonts, colors and backgrounds for every export."
  feat_looks: "Each AI's own look"
  feat_looks_d: "Read chats exactly as each AI shows them."
  feat_sync: "Sync every AI in one click"
  feat_sync_d: "Update all your AIs at once, automatically."
  feat_grok: "Grok media and deleted chats"
  feat_grok_d: "Keep Grok images and videos, even deleted chats."
  feat_ais: "Works with 18 AIs"
  feat_ais_d: "ChatGPT, Claude, Gemini, Grok and 14 more."
  pro_label: "Pro feature"
  how_h2: How it works
  steps:
  - t: Install the extension
    d: Add it to Chrome and pin the icon.
  - t: Stay signed in to your AIs
    d: Use the AI sites in the same browser profile, as you already do.
  - t: "Save your chats"
    d: "Save the chat you have open on any AI’s page. With Pro, press Sync everything; only new and changed chats are saved."
  help_eyebrow: "Help"
  help_h2: "How to get Pro"
  help_p: "Watch the 30-second tour, or follow the steps below."
  help_steps:
  - t: "Choose a plan"
    d: "Press Get Pro on the Pricing page, or Upgrade inside the extension."
  - t: "Pay securely"
    d: "The Freemius checkout opens. Pay by card or PayPal."
  - t: "Copy your licence key"
    d: "It shows on the thank-you screen and arrives by email."
  - t: "Activate it"
    d: "In the extension, open Settings, paste the key and press Activate. Pro is on."
  help_more: "Still stuck? Email <a href=\"mailto:%email%\">%email%</a> and we'll help."
  help_video: "Video: getting Pro and activating your licence key"
  priv_eyebrow: Privacy
  priv_h2: Your chats never come to us
  priv_p: '%name% reads your chats through your browser from the AI sites you are signed in to, and writes them only to your own folder and your browser’s local storage. Read the full <a href="%privacy_url%">Privacy Policy</a>.'
  priv_items:
  - No chat content is sent to the developer
  - No analytics or tracking
  - No selling of data, ever
  - Uninstall or delete the folder to remove everything
  faq_h2: Questions
  faq:
  - q: Do I need an account?
    a: No. %name% uses the sessions you already have on each AI site. Pro uses a licence key from our payment partner, Freemius. Paste it into the extension once and you are signed in.
  - q: Where are my chats saved?
    a: "In Downloads/AI Chat Saver. With Pro you can choose any folder."
  - q: What happens if an AI site changes?
    a: After each sync the extension checks every AI. If a site changed and saving stops working, you get one notification and a banner, and a broken run never overwrites a good saved chat.
  - q: Is it free?
    a: Yes, there is a Free plan. %pro_status%. See <a href="%pricing_url%">Pricing</a>.
  - q: "Can I get a refund?"
    a: "Pro Yearly: a full refund within 7 days of your first payment. Pro Monthly is not refundable, but you can cancel any time and keep Pro until the end of the month you paid for."
  - q: I lost my licence key or typed the wrong email
    a: Email <a href="mailto:%email%">%email%</a> with your payment receipt. We'll correct the email on your licence and send the key again.
  cta_h2: Keep every conversation
