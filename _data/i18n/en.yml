  lifetime_sub: Pay once, keep Pro for good.
  per_lifetime: one-time
  yearly_cta: Get Pro
  monthly_cta: Get Pro
  lifetime_cta: Get Pro
  free_badge: ''
  yearly_badge: ''
  monthly_badge: ''
  lifetime_badge: ''
  howpro_h2: How Pro works
  howpro_p: No account to create and no password. Your licence key is your sign-in.
  howpro_steps:
  - t: Choose a plan
    d: Press Get Pro here or Upgrade inside the extension. A secure checkout by Freemius opens. Pay by card or PayPal.
  - t: Get your licence key
    d: It shows on the thank-you screen right away and is emailed to the address you used at checkout.
  - t: Activate in the extension
    d: Open Pro, paste your key and press Activate. You'll see "Signed in as" your email, your plan and its renewal date.
  - t: Manage any time
    d: Use Manage account to see invoices, cancel or find your key again. Sign out on one device to use Pro on another.
  fine: Payments and licence keys for Pro are handled by our reseller and merchant of record, Freemius, Inc. Taxes may be added at checkout depending on where you live. See the <a href="%terms_url%">Terms of Service</a>. Statutory consumer rights, where they apply, are not affected.
